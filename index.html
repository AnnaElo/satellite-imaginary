<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FINverse · Ouluversumi</title>
  <script>window.CESIUM_BASE_URL = "vendor/cesium/";</script>
  <link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="globe"></div>

  <div id="epic" class="epic" aria-hidden="true">
    <img alt="">
    <div class="epic-cap"></div>
  </div>

  <div id="phase" class="phase" aria-live="polite"></div>

  <div id="card" class="card">
    <div class="eyebrow"></div>
    <div class="title"></div>
    <div class="sub"></div>
  </div>

  <div id="aerial-cap" class="aerial-cap"></div>

  <svg id="leader" class="leader" aria-hidden="true"><line x1="0" y1="0" x2="0" y2="0"></line></svg>

  <div id="reticle" class="reticle" aria-hidden="true">
    <svg viewBox="-50 -50 100 100">
      <polygon class="hex" points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"></polygon>
      <circle class="ring" r="34"></circle>
      <path class="brackets" d="M-30,-40 h-10 v10 M30,-40 h10 v10 M-30,40 h-10 v-10 M30,40 h10 v-10"></path>
    </svg>
  </div>

  <aside id="info" class="hud" aria-live="polite">
    <div class="hud-head">
      <span class="hud-scan">Scan complete</span>
      <h2 class="hud-title"></h2>
    </div>
    <div class="hud-section">Data</div>
    <dl class="hud-data"></dl>
    <div class="hud-section">Analysis</div>
    <p class="hud-analysis"></p>
    <div class="hud-source"></div>
  </aside>

  <footer class="footer">
    <span id="mode" class="mode"></span>
    <span id="source" class="source"></span>
  </footer>

  <nav id="panel" class="panel" aria-label="Viewing options">
    <div class="row">
      <span class="lbl">Source</span>
      <div class="seg">
        <button type="button" data-act="online" title="Imagery loaded live from NASA, Copernicus and the National Land Survey of Finland">Online</button>
        <button type="button" data-act="offline" title="Local files only (tiles folder)">Offline</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Quality</span>
      <div class="seg">
        <button type="button" data-act="hq" title="Full screen resolution">Sharp</button>
        <button type="button" data-act="lite" title="Lighter, for slower computers">Light</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Show</span>
      <div class="seg">
        <button type="button" data-act="pause">Pause</button>
        <button type="button" data-act="restart">Restart</button>
        <button type="button" data-act="fullscreen">Fullscreen</button>
      </div>
    </div>
    <div class="row meta">
      <span id="fps" class="fps">– FPS</span>
      <span class="keys">H hides this menu</span>
    </div>
  </nav>

  <script src="vendor/cesium/Cesium.js"></script>
  <script src="js/config.js"></script>
  <script src="tiles/manifest.js" onerror="void 0"></script>
  <script src="js/app.js"></script>
</body>
</html>
