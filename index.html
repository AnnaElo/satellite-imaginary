<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maapallo – Oulu</title>
  <script>window.CESIUM_BASE_URL = "vendor/cesium/";</script>
  <link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="globe"></div>

  <div id="phase" class="phase" aria-live="polite"></div>

  <div id="card" class="card">
    <div class="eyebrow">65,01° N · 25,47° E</div>
    <div class="title"></div>
    <div class="sub"></div>
  </div>

  <footer class="footer">
    <span id="mode" class="mode"></span>
    <span id="source" class="source"></span>
  </footer>

  <nav id="panel" class="panel" aria-label="Katselutavat">
    <div class="row">
      <span class="lbl">Lähde</span>
      <div class="seg">
        <button type="button" data-act="online" title="Kuvat haetaan suoraan NASAn ja Copernicuksen palveluista">Verkko</button>
        <button type="button" data-act="offline" title="Vain paikalliset tiedostot (kansio tiles/)">Offline</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Kuva</span>
      <div class="seg">
        <button type="button" data-act="clear" title="Pilvetön kuvakooste">Pilvetön</button>
        <button type="button" data-act="daily" title="Satelliittikuvat kahdelta viime päivältä">Tuore</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Laatu</span>
      <div class="seg">
        <button type="button" data-act="hq" title="Näytön täysi tarkkuus">Tarkka</button>
        <button type="button" data-act="lite" title="Kevyempi heikoille koneille">Kevyt</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Esitys</span>
      <div class="seg">
        <button type="button" data-act="pause">Tauko</button>
        <button type="button" data-act="restart">Alusta</button>
        <button type="button" data-act="fullscreen">Koko näyttö</button>
      </div>
    </div>
    <div class="row meta">
      <span id="fps" class="fps">– FPS</span>
      <span class="keys">H piilottaa valikon</span>
    </div>
  </nav>

  <script src="vendor/cesium/Cesium.js"></script>
  <script src="js/config.js"></script>
  <script src="tiles/manifest.js" onerror="void 0"></script>
  <script src="js/app.js"></script>
</body>
</html>
